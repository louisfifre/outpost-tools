<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%237fb850' d='M16 2l14 7-14 7L2 9z'/%3E%3Cpath fill='%238b6344' d='M2 9l14 7v14L2 23z'/%3E%3Cpath fill='%236b4b33' d='M30 9l-14 7v14l14-7z'/%3E%3C/svg%3E">
<style>
  /* The same two grounds as the preview page: pure black, or a white that is almost white. */
  :root {
    color-scheme: dark;
    --ground: #000;
    --line: #2a2a2a;
    --text: #ececec;
    --muted: #8a8a8a;
    --track: #6a6a6a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --ground: #fafaf8;
      --line: #deded9;
      --text: #171717;
      --muted: #707070;
      --track: #9a9a96;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 24px 28px;
    overflow: hidden;               /* one screen, never a scrollbar */
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  [hidden] { display: none !important; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #settings-view { gap: 16px; }
  header { display: flex; align-items: center; gap: 10px; min-height: 32px; margin-bottom: 4px; }
  /* A title is the same text as the rest, only heavier: no capitals, as on the preview page. */
  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
  }
  /* Who plays: said once, opposite the title, since it holds for every row. */
  #account { margin-left: auto; font-size: 13px; color: var(--muted); }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 6px;
    background: none;
    transition: color 120ms, filter 120ms;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }
  svg { width: 18px; height: 18px; display: block; fill: currentColor; }
  .icon { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); }
  .icon:hover { color: var(--text); }

  /* A row: a name and a line about it, then what can be done with it. Rows are set apart by a line. */
  .profile {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
  }
  .profile .who { flex: 1; min-width: 0; }
  .profile .name { font-size: 18px; font-weight: 600; }
  .profile .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* What a launch is doing is said in the row that was asked, in the text colour: it is the news of the moment. */
  .profile .meta.now { color: var(--text); }
  /* No colour here either: the button to play is the text colour, filled. */
  .play { background: var(--text); color: var(--ground); }
  .play:hover { opacity: 0.85; color: var(--ground); }
  .play:disabled:hover { opacity: 0.5; }

  /* Settings of one profile. */
  label, .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field { display: flex; flex-direction: column; }
  .memory { display: flex; align-items: center; gap: 14px; }
  .memory output { min-width: 5ch; text-align: right; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* The same controls as the world preview. A slider is a hairline and a thin mark to move, wider than
     what it shows so it stays easy to catch. */
  input[type=range] {
    flex: 1; height: 22px; margin: 0; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(var(--track), var(--track)) 0 50% / 100% 1px no-repeat;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 22px; background: none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 17px; height: 22px; border: 0; border-radius: 0;
    background: linear-gradient(var(--text), var(--text)) center / 2px 14px no-repeat;
  }
  /* A switch is not a slider: a small frame with a square that sits left when off, right and lit when on.
     Underneath it is a range of two places, as on the preview page. */
  input.switch { flex: none; width: 30px; height: 16px; padding: 2px; border: 1px solid var(--track); background: none; }
  input.switch::-webkit-slider-runnable-track { height: 10px; }
  input.switch::-webkit-slider-thumb { width: 10px; height: 10px; background: var(--muted); }
  input.switch.on { border-color: var(--text); }
  input.switch.on::-webkit-slider-thumb, input.switch:hover:not(:disabled)::-webkit-slider-thumb { background: var(--text); }
  .toggle { display: flex; align-items: center; gap: 10px; }
  .toggle label { flex: 1; margin: 0; }
  .toggle output { font-size: 13px; font-weight: 600; }
  textarea, select, input[type=text] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--ground);
    color: var(--text);
    font: inherit;
  }
  textarea, input[type=text] { font: 13px/1.5 "Cascadia Mono", Consolas, monospace; user-select: text; }
  textarea { height: 84px; resize: none; }
  #server { margin-top: 8px; }
  :disabled { opacity: 0.5; }
  .folder { display: flex; align-items: center; gap: 8px; }
  .folder code {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 13px "Cascadia Mono", Consolas, monospace;
    user-select: text;
  }
  .folder button { padding: 6px 12px; font-size: 13px; border: 1px solid var(--line); }
  /* The preview is a tool, not a profile: same row, but the whole row is the button, and no line under the last one. */
  #world { width: 100%; text-align: left; border-bottom: 0; border-radius: 0; }
  #world:hover .icon { color: var(--text); }
  /* The server is not a way of playing: it sits apart from the profiles, under a small title of its own. */
  .group { margin-top: 18px; font-size: 13px; color: var(--muted); }
  #server-view { gap: 12px; }
  #server-view textarea { height: 56px; }
  .pair { display: flex; gap: 12px; }
  .pair .field { flex: 1; min-width: 0; }
  input[type=number] {
    width: 100%; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--ground); color: var(--text);
    font: 13px/1.5 "Cascadia Mono", Consolas, monospace; user-select: text;
  }
  #status { margin-top: 12px; min-height: 20px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <section class="view" id="list-view">
    <header><h1 data-text="title"></h1><span id="account"></span></header>
    <div class="view" id="profiles"></div>
    <div class="group" data-text="serverGroup"></div>
    <div class="profile" id="server-row">
      <div class="who"><div class="name" data-text="serverName"></div><div class="meta" id="server-meta"></div></div>
    </div>
    <button id="world" class="profile">
      <span class="who"><span class="name" data-text="world" style="display:block"></span><span class="meta" data-text="worldAbout"></span></span>
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M14 4h6v6h-2V7.4l-7.3 7.3-1.4-1.4L16.6 6H14zM5 6h6v2H6v10h10v-5h2v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/></svg></span>
    </button>
  </section>

  <section class="view" id="settings-view" hidden>
    <header>
      <button class="icon" id="back"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <h1 id="settings-name"></h1>
    </header>
    <div class="field">
      <label for="open-on" data-text="openOn"></label>
      <select id="open-on"></select>
      <input type="text" id="server" spellcheck="false" hidden>
    </div>
    <div class="field">
      <label for="memory" data-text="memory"></label>
      <div class="memory">
        <input type="range" id="memory" min="2" step="1">
        <output id="memory-value" for="memory"></output>
      </div>
    </div>
    <div class="field">
      <label for="java-args" data-text="javaArgs"></label>
      <textarea id="java-args" spellcheck="false"></textarea>
    </div>
    <div class="field">
      <span class="label" data-text="folder"></span>
      <div class="folder"><code id="folder-path"></code><button id="open-folder" data-text="open"></button></div>
    </div>
  </section>

  <section class="view" id="server-view" hidden>
    <header>
      <button class="icon" id="server-back"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <h1 data-text="serverName"></h1>
    </header>
    <div class="field">
      <label for="server-memory" data-text="memory"></label>
      <div class="memory">
        <input type="range" id="server-memory" min="2" step="1">
        <output id="server-memory-value" for="server-memory"></output>
      </div>
    </div>
    <div class="field">
      <label for="server-java-args" data-text="javaArgs"></label>
      <textarea id="server-java-args" spellcheck="false"></textarea>
    </div>
    <div class="pair">
      <div class="field"><label for="view-distance" data-text="viewDistance"></label><input type="number" id="view-distance" min="3" max="32" data-prop="viewDistance"></div>
      <div class="field"><label for="simulation-distance" data-text="simulationDistance"></label><input type="number" id="simulation-distance" min="5" max="32" data-prop="simulationDistance"></div>
    </div>
    <div class="pair">
      <div class="field"><label for="max-players" data-text="maxPlayers"></label><input type="number" id="max-players" min="1" max="100" data-prop="maxPlayers"></div>
      <div class="field"><label for="server-port" data-text="port"></label><input type="number" id="server-port" min="1024" max="65535" data-prop="port"></div>
    </div>
    <div class="toggle">
      <label for="whitelist" data-text="whitelist"></label>
      <output id="whitelist-value" for="whitelist"></output>
      <input type="range" class="switch" id="whitelist" min="0" max="1" step="1">
    </div>
    <div class="field">
      <label for="motd" data-text="motd"></label>
      <input type="text" id="motd" maxlength="59" spellcheck="false">
    </div>
    <div class="field">
      <div class="folder"><code id="server-folder"></code><button id="open-server-folder" data-text="open"></button></div>
    </div>
  </section>

  <div id="status" role="status"></div>

<script>
  // Every sentence the page shows, in one place.
  const text = {
    title: 'Minecraft',
    noAccount: 'No account: sign in once in Prism',
    world: 'World preview',
    worldAbout: 'Try a seed and terrain settings, without playing',
    play: name => `Play ${name}`,
    settings: name => `Settings of ${name}`,
    back: 'Back',
    // The line under a profile's name.
    neverPlayed: 'not played yet',
    playedMinutes: n => `${n} min played`,
    playedHours: n => `${n} h played`,
    opensWorld: name => `opens ${name}`,
    joinsServer: address => `joins ${address}`,
    // What a launch is doing, by the word the server answers.
    launch: {
      starting: 'Starting…',
      preparing: 'Syncing the pack…',
      loading: seconds => `Loading the game… ${seconds} s`,
      running: 'Running',
      waiting: 'Prism is waiting for you: look at its window.',
      prepareFailed: 'The pack sync failed. Prism’s window says why.',
      stopped: 'The game stopped before its window opened. Prism shows its log.',
      failed: 'Prism closed without starting the game.',
    },
    openOn: 'Opens on',
    onMenu: 'the game menu',
    onWorld: name => `world: ${name}`,
    onServer: 'a server',
    serverAddress: 'address, for example localhost',
    memory: 'Memory',
    gigabytes: n => `${n} GB`,
    javaArgs: 'Java arguments',
    folder: 'Game folder',
    open: 'Open',
    saved: 'Saved.',
    refused: 'Setting refused, nothing changed.',
    locked: 'Minecraft is running: settings can change once it is closed.',
    failed: 'The request failed.',
    serverGone: 'The launcher has stopped. Close this window and open it again.',
    // The dev server.
    serverGroup: 'Server',
    serverName: 'Dev server',
    startServer: 'Start the server',
    stopServer: 'Stop the server',
    serverSettings: 'Settings of the server',
    server: {
      stopped: port => `stopped · joins at localhost:${port}`,
      preparing: 'Syncing the mods… its window shows each step',
      starting: 'Starting the world…',
      running: port => `Running · localhost:${port}`,
      failed: 'The start failed. Its window says why.',
      stopping: 'Saving and stopping…',
    },
    noEula: 'EULA not accepted yet',
    viewDistance: 'View distance (chunks)',
    simulationDistance: 'Simulation distance',
    maxPlayers: 'Players at most',
    port: 'Port',
    motd: 'Line in the server list',
    whitelist: 'Only players on the whitelist',
    on: 'on',
    off: 'off',
    firstStart: 'Distances, players, port and line appear after the first start.',
    serverLocked: 'The server is running: settings can change once it is stopped.',
  };
  const icons = {
    play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><path d="M3 6h10v2H3zm14 0h4v2h-4zM3 16h4v2H3zm8 0h10v2H11z"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>',
  };

  const $ = id => document.getElementById(id);

  // The browser keeps this window's size from one opening to the next, but a window that joins a browser
  // already running ignores the size its command line asks for. So the page sets it itself, the first
  // time only: after that, the size is whatever the person left.
  try {
    if (!localStorage.getItem('launcher.sized')) { resizeTo(440, 560); localStorage.setItem('launcher.sized', '1'); }
  } catch { }

  // The page is a window of its own, not a document: its text keeps one size. Ctrl with the wheel, a pinch
  // (which arrives as the same thing) and Ctrl with plus or minus no longer zoom it. Ctrl+0 is left alone,
  // to undo a zoom the browser kept from before.
  addEventListener('wheel', event => { if (event.ctrlKey) event.preventDefault(); }, { passive: false });
  addEventListener('keydown', event => { if ((event.ctrlKey || event.metaKey) && '+-=_'.includes(event.key)) event.preventDefault(); });
  for (const el of document.querySelectorAll('[data-text]')) el.textContent = text[el.dataset.text];
  $('back').setAttribute('aria-label', text.back);
  $('server').placeholder = text.serverAddress;

  let profiles = [];
  let locked = false;   // Prism is running: it would write its own settings over ours
  let current = null;   // the profile whose settings are open
  let launching = null; // { id, state, since } while this window follows a launch

  async function post(path, body) {
    const reply = await fetch(path, { method: 'POST', body: body ? JSON.stringify(body) : undefined });
    if (!reply.ok) throw new Error(reply.status);
  }
  const say = sentence => { $('status').textContent = sentence; };

  function iconButton(kind, label, onClick) {
    const b = document.createElement('button');
    b.className = `icon ${kind}`;
    b.innerHTML = icons[kind];
    b.setAttribute('aria-label', label);
    b.title = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function show(view) {
    $('list-view').hidden = view !== 'list';
    $('settings-view').hidden = view !== 'settings';
    $('server-view').hidden = view !== 'server';
    say('');
  }

  // "yesterday · 20 min played · opens New World": when, how much, and what Play will open.
  function about(profile) {
    if (!profile.lastPlayed) return text.neverPlayed;
    const day = 24 * 3600 * 1000;
    const startOf = t => new Date(t).setHours(0, 0, 0, 0);
    const days = Math.round((startOf(profile.lastPlayed) - startOf(Date.now())) / day);
    const parts = [new Intl.RelativeTimeFormat('en', { numeric: 'auto' }).format(days, 'day')];
    const minutes = Math.round(profile.playedSeconds / 60);
    if (minutes >= 60) parts.push(text.playedHours(+(minutes / 60).toFixed(minutes < 600 ? 1 : 0)));
    else if (minutes > 0) parts.push(text.playedMinutes(minutes));
    if (profile.open.kind === 'world') parts.push(text.opensWorld(profile.open.target));
    if (profile.open.kind === 'server') parts.push(text.joinsServer(profile.open.target));
    return parts.join(' · ');
  }

  function launchSentence() {
    const sentence = text.launch[launching.state];
    return typeof sentence === 'function' ? sentence(Math.round((Date.now() - launching.since) / 1000)) : sentence;
  }

  function render() {
    // The profile played last comes first.
    const ordered = [...profiles].sort((a, b) => b.lastPlayed - a.lastPlayed || a.name.localeCompare(b.name));
    $('profiles').replaceChildren(...ordered.map(profile => {
      const row = document.createElement('div');
      row.className = 'profile';
      const who = document.createElement('div');
      who.className = 'who';
      who.innerHTML = '<div class="name"></div><div class="meta"></div>';
      who.children[0].textContent = profile.name;
      const followed = launching && launching.id === profile.id;
      const now = followed ? launchSentence() : profile.running ? text.launch.running : '';
      who.children[1].textContent = now || about(profile);
      who.children[1].classList.toggle('now', !!now);
      const playButton = iconButton('play', text.play(profile.name), () => play(profile));
      // One launch at a time, and never a second copy of a game that is open.
      playButton.disabled = profile.running || (launching && !launching.over);
      row.append(who, playButton,
        iconButton('settings', text.settings(profile.name), () => openSettings(profile)));
      return row;
    }));
  }

  async function load() {
    const data = await fetch('/api/profiles').then(r => r.json());
    profiles = data.profiles;
    locked = data.locked;
    $('account').textContent = data.account || text.noAccount;
    // Leave the system a quarter of the machine's memory.
    $('memory').max = $('server-memory').max = Math.floor(data.machineMb / 1024 * 0.75);
    render();
    if (current) lock();
  }

  // The server only knows that Prism was started. What happens next is asked every second:
  // the pack sync, the game loading, its window, or the reason there is none.
  async function play(profile) {
    launching = { id: profile.id, state: 'starting', since: Date.now() };
    render();
    try { await post(`/api/launch/${profile.id}`); }
    catch { launching = null; say(text.failed); return load(); }
    const follow = setInterval(async () => {
      try { launching.state = (await fetch('/api/launch').then(r => r.json())).state; } catch { return; }
      launching.over = ['running', 'prepareFailed', 'stopped', 'failed'].includes(launching.state);
      render();
      if (!launching.over) return;
      clearInterval(follow);
      // The game is on screen; this window has nothing left to show. A failure stays, to be read.
      if (launching.state === 'running') setTimeout(() => window.close(), 1500);
    }, 1000);
  }

  function lock() {
    for (const id of ['open-on', 'server', 'memory', 'java-args']) $(id).disabled = locked;
    if (locked) say(text.locked);
    else if ($('status').textContent === text.locked) say('');
  }

  function openSettings(profile) {
    current = profile;
    $('settings-name').textContent = profile.name;
    const options = [['menu', '', text.onMenu], ...profile.worlds.map(w => ['world', w, text.onWorld(w)]), ['server', '', text.onServer]];
    $('open-on').replaceChildren(...options.map(([kind, target, label]) => {
      const option = new Option(label, JSON.stringify({ kind, target }));
      option.selected = kind === profile.open.kind && (kind !== 'world' || target === profile.open.target);
      return option;
    }));
    $('server').value = profile.open.kind === 'server' ? profile.open.target : '';
    $('server').hidden = profile.open.kind !== 'server';
    $('memory').value = Math.round(profile.memoryMb / 1024);
    $('memory-value').textContent = text.gigabytes($('memory').value);
    $('java-args').value = profile.javaArgs;
    $('folder-path').textContent = profile.gameDir;
    show('settings');
    lock();
  }

  // Saved as soon as a field is left or the slider released: no Save button to forget.
  async function save() {
    const open = JSON.parse($('open-on').value);
    if (open.kind === 'server') open.target = $('server').value.trim();
    // A server without its address is not a choice yet: wait for the address.
    if (open.kind === 'server' && !open.target) return;
    const next = { memoryMb: $('memory').value * 1024, javaArgs: $('java-args').value.trim(), open };
    try {
      await post(`/api/settings/${current.id}`, next);
      Object.assign(current, next);
      say(text.saved);
    } catch (e) { say(e.message === '400' ? text.refused : e.message === '409' ? text.locked : text.failed); }
  }

  $('back').addEventListener('click', () => { current = null; show('list'); load().catch(() => say(text.failed)); });
  // The preview needs room for a map, so it opens in its own, larger window.
  // The preview lives in its own repository: when it cannot be found, the server says where it looked.
  $('world').addEventListener('click', async () => {
    try {
      const reply = await fetch('/api/preview/open', { method: 'POST' });
      if (!reply.ok) say((await reply.json().catch(() => ({}))).error || text.failed);
    } catch { say(text.failed); }
  });
  $('open-on').addEventListener('change', () => {
    const server = JSON.parse($('open-on').value).kind === 'server';
    $('server').hidden = !server;
    if (server && !$('server').value) $('server').focus();
    save();
  });
  $('server').addEventListener('change', save);
  $('memory').addEventListener('input', () => { $('memory-value').textContent = text.gigabytes($('memory').value); });
  $('memory').addEventListener('change', save);
  $('java-args').addEventListener('change', save);
  $('open-folder').addEventListener('click', () => post(`/api/folder/${current.id}`).catch(() => say(text.failed)));

  // The dev server: one row apart from the profiles, started in a console window of its own.
  let server = null;      // what /api/server answered last
  let stopping = false;   // "stop" was sent and the server has not gone yet
  const serverBusy = () => server && ['preparing', 'starting', 'running'].includes(server.state);
  const serverPort = () => server.props ? server.props.port : 25565;

  function renderServer() {
    if (!server) return;
    if (server.state === 'stopped' || server.state === 'failed') stopping = false;
    const state = stopping ? 'stopping' : server.state;
    const sentence = text.server[state];
    let line = typeof sentence === 'function' ? sentence(serverPort()) : sentence;
    if (state === 'stopped' && !server.eula) line = text.noEula;
    $('server-meta').textContent = line;
    $('server-meta').classList.toggle('now', state !== 'stopped');
    const running = server.state === 'running';
    const toggle = running
      ? iconButton('stop', text.stopServer, stopServer)
      : iconButton('play', text.startServer, startServer);
    // Start once at a time; stop only a server that is ready to hear it.
    toggle.disabled = stopping || (!running && serverBusy());
    $('server-row').replaceChildren($('server-row').firstElementChild, toggle,
      iconButton('settings', text.serverSettings, openServerSettings));
  }

  async function loadServer() {
    server = await fetch('/api/server').then(r => r.json());
    renderServer();
    if (!$('server-view').hidden) lockServer();
  }

  async function startServer() {
    try {
      const reply = await fetch('/api/server/start', { method: 'POST' });
      if (!reply.ok) say((await reply.json().catch(() => ({}))).error || text.failed);
    } catch { say(text.failed); }
    loadServer().catch(() => {});
  }

  async function stopServer() {
    stopping = true;
    renderServer();
    try { await post('/api/server/stop'); } catch { stopping = false; say(text.failed); }
    loadServer().catch(() => {});
  }

  const propFields = () => [...document.querySelectorAll('#server-view [data-prop]')];

  function lockServer() {
    const busy = serverBusy();
    for (const id of ['server-memory', 'server-java-args']) $(id).disabled = busy;
    for (const el of [...propFields(), $('motd'), $('whitelist')]) el.disabled = busy || !server.props;
    if (busy) say(text.serverLocked);
    else if (!server.props) say(text.firstStart);
    else if ([text.serverLocked, text.firstStart].includes($('status').textContent)) say('');
  }

  function openServerSettings() {
    $('server-memory').value = Math.round(server.memoryMb / 1024);
    $('server-memory-value').textContent = text.gigabytes($('server-memory').value);
    $('server-java-args').value = server.javaArgs;
    for (const el of propFields()) el.value = server.props ? server.props[el.dataset.prop] : '';
    $('motd').value = server.props ? server.props.motd : '';
    $('whitelist').value = server.props && server.props.whitelist ? 1 : 0;
    showWhitelist();
    $('server-folder').textContent = server.dir;
    show('server');
    lockServer();
  }

  // Saved as soon as a field is left, as for a profile.
  async function saveServer() {
    const next = { memoryMb: $('server-memory').value * 1024, javaArgs: $('server-java-args').value.trim() };
    if (server.props) {
      next.props = { motd: $('motd').value.trim(), whitelist: $('whitelist').value === '1' };
      for (const el of propFields()) next.props[el.dataset.prop] = Number(el.value);
    }
    try {
      await post('/api/server/settings', next);
      Object.assign(server, next);
      say(text.saved);
    } catch (e) { say(e.message === '400' ? text.refused : e.message === '409' ? text.serverLocked : text.failed); }
  }

  function showWhitelist() {
    const on = $('whitelist').value === '1';
    $('whitelist').classList.toggle('on', on);
    $('whitelist-value').textContent = on ? text.on : text.off;
  }
  // A click anywhere on the frame turns the switch over, where a range would only move to the half clicked.
  function flipWhitelist() {
    if ($('whitelist').disabled) return;
    $('whitelist').value = 1 - $('whitelist').value;
    showWhitelist();
    saveServer();
  }
  $('whitelist').addEventListener('pointerdown', event => { event.preventDefault(); $('whitelist').focus(); flipWhitelist(); });
  $('whitelist').addEventListener('keydown', event => {
    if (event.key === ' ' || event.key === 'Enter') { event.preventDefault(); flipWhitelist(); }
  });
  $('whitelist').addEventListener('input', () => { showWhitelist(); saveServer(); });

  $('server-back').addEventListener('click', () => { show('list'); loadServer().catch(() => say(text.failed)); });
  $('server-memory').addEventListener('input', () => { $('server-memory-value').textContent = text.gigabytes($('server-memory').value); });
  for (const el of [$('server-memory'), $('server-java-args'), $('motd'), ...propFields()]) el.addEventListener('change', saveServer);
  $('open-server-folder').addEventListener('click', () => post('/api/server/folder').catch(() => say(text.failed)));
  // The server changes on its own (its window can stop it too): its row is asked again every few seconds.
  setInterval(() => { if (!document.hidden) loadServer().catch(() => {}); }, 3000);

  // Tells a capture that the page is drawn (see scripts/capture.ps1).
  Promise.all([load(), loadServer()]).then(() => { document.documentElement.dataset.ready = '1'; });
  // Coming back to this window after a game: what runs and what was played may have changed.
  window.addEventListener('focus', () => { if (!launching || launching.over) load().catch(() => {}); });

  // The server stops by itself when these pings stop, that is, when this window closes.
  setInterval(() => fetch('/api/ping').catch(() => say(text.serverGone)), 10000);
</script>
</body>
</html>
