<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #15171a;
    --surface: #1f2226;
    --surface-hover: #2a2e33;
    --line: #33383e;
    --text: #e8e6e1;
    --muted: #8d9197;
    --accent: #7fb069;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: 28px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--ground);
    color: var(--text);
    font: 15px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    transition: background 120ms, border-color 120ms;
  }
  button:hover { background: var(--surface-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }
  #profiles { display: flex; flex-direction: column; gap: 12px; }
  .profile {
    padding: 20px;
    text-align: left;
    font-size: 20px;
    font-weight: 600;
  }
  .profile:hover { border-color: var(--accent); }
  footer {
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  #status { color: var(--muted); font-size: 13px; }
  #account { padding: 6px 12px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div id="profiles"></div>
  <footer>
    <span id="status" role="status"></span>
    <button id="account"></button>
  </footer>

<script>
  // Every sentence the page shows, in one place.
  const text = {
    title: 'Minecraft',
    account: 'Compte et skin',
    starting: name => `${name} démarre…`,
    accountOpening: 'Prism s’ouvre…',
    failed: 'Le lancement a échoué.',
    serverGone: 'Le lanceur s’est arrêté. Ferme cette fenêtre et rouvre-le.',
  };

  const status = document.getElementById('status');
  const profiles = document.getElementById('profiles');
  const account = document.getElementById('account');
  document.getElementById('title').textContent = text.title;
  account.textContent = text.account;

  async function ask(path) {
    const reply = await fetch(path, { method: 'POST' });
    if (!reply.ok) throw new Error(reply.status);
  }

  async function launch(profile) {
    for (const b of document.querySelectorAll('button')) b.disabled = true;
    status.textContent = text.starting(profile.name);
    try {
      await ask(`/api/launch/${profile.id}`);
      // The game takes over from here; this window has nothing left to show.
      setTimeout(() => window.close(), 2500);
    } catch {
      status.textContent = text.failed;
      for (const b of document.querySelectorAll('button')) b.disabled = false;
    }
  }

  account.addEventListener('click', async () => {
    status.textContent = text.accountOpening;
    try { await ask('/api/prism'); } catch { status.textContent = text.failed; }
  });

  fetch('/api/profiles').then(r => r.json()).then(list => {
    for (const profile of list) {
      const b = document.createElement('button');
      b.className = 'profile';
      b.textContent = profile.name;
      b.addEventListener('click', () => launch(profile));
      profiles.append(b);
    }
  });

  // The server stops by itself when these pings stop, that is, when this window closes.
  setInterval(() => fetch('/api/ping').catch(() => { status.textContent = text.serverGone; }), 10000);
</script>
</body>
</html>
