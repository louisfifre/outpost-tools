[package]
name = "launcher-native"
version = "0.1.0"
edition = "2024"
description = "The native launcher: the world preview's window with the launcher's Home, drawn with mere-ui, answering through app's own api."
publish = false

[lib]
name = "launcher_native"
path = "src/lib.rs"

[[bin]]
name = "launcher-native"
path = "src/main.rs"

[dependencies]
# The api and the system side of the page's launcher, as a library, without its window (tao and wry).
launcher = { path = "../app", default-features = false }
serde_json = "1"
# The toolkit and the world preview, from mere-ui's checkout, the sibling folder of this repository.
# Cargo takes no variable in a path dependency, so a worktree of this repository that sits elsewhere must point
# these at mere-ui's folder for as long as it is tried there.
mere-base = { path = "../../mere-ui/crates/mere-base" }
mere-layout = { path = "../../mere-ui/crates/mere-layout" }
mere-ui = { path = "../../mere-ui/crates/mere-ui" }
mere-win32 = { path = "../../mere-ui/crates/mere-win32" }
mere-png = { path = "../../mere-ui/crates/mere-png" }
preview = { path = "../../mere-ui/demos/preview" }

[profile.release]
opt-level = "s"
lto = true
strip = true
