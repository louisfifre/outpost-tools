[package]
name = "outpost-tools"
version = "0.1.0"
edition = "2024"
description = "Outpost Tools: the world preview's window with the Home of its tools, drawn with mere-ui, answering through app's own api."
publish = false

[lib]
name = "outpost_tools"
path = "src/lib.rs"

[[bin]]
name = "outpost-tools"
path = "src/main.rs"

[dependencies]
# The api and the system side of the page's launcher, as a library, without its window (tao and wry).
launcher = { path = "../app", default-features = false }
serde_json = "1"
# The toolkit, pinned by tag.
mere-base = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.16.0" }
mere-layout = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.16.0" }
mere-ui = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.16.0" }
mere-win32 = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.16.0" }
mere-png = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.16.0" }
# The world preview's window, from this repository.
preview = { path = "../preview" }

[profile.release]
opt-level = "s"
lto = true
strip = true
