[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "The launcher application: a frameless window showing launcher/index.html, and everything the page asks for."
publish = false

[dependencies]
tao = "0.37"
wry = "0.57"
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
