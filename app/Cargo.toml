[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "The launcher application: a frameless window showing index.html, and everything the page asks for."
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "launcher"
path = "src/main.rs"
required-features = ["window"]

[features]
default = ["window"]
# The window of the page (tao and wry). native takes this package as a library without them: it draws
# its own window.
window = ["dep:tao", "dep:wry"]

[dependencies]
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
serde_json = "1"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
