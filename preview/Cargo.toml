[package]
name = "preview"
description = "The world preview as a native window, grown step by step: step 13 is its shell with static values."
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
mere-base = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.14.0" }
mere-layout = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.14.0" }
mere-ui = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.14.0" }
mere-win32 = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.14.0" }
mere-png = { git = "https://github.com/louisfifre/mere-ui", tag = "v0.14.0" }
# The engine, as a library, from the world-preview repository.
world-preview = { git = "https://github.com/louisfifre/world-preview", tag = "v0.22.0" }

[profile.release]
opt-level = 3
lto = true
strip = true
